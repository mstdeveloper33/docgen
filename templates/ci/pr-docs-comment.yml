# Auto-comment PR with documentation for changed files
name: PR Docs Comment

on:
  pull_request:
    paths:
      - '**.dart'
      - '**.kt'

permissions:
  pull-requests: write

jobs:
  docs-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate docgen_cli
      - name: Generate docs for changed files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.dart' '*.kt')
          if [ -z "$FILES" ]; then
            echo "No Dart/Kotlin files changed"
            exit 0
          fi
          docgen run --diff origin/${{ github.base_ref }} --format markdown
      - name: Build comment body
        id: docs
        run: |
          if [ -d docs ]; then
            echo 'body<<EOF' >> $GITHUB_OUTPUT
            echo '## 📖 Auto-Generated Documentation' >> $GITHUB_OUTPUT
            echo '' >> $GITHUB_OUTPUT
            echo 'Documentation for changed files in this PR:' >> $GITHUB_OUTPUT
            echo '' >> $GITHUB_OUTPUT
            for f in docs/*.md; do
              [ -f "$f" ] || continue
              echo '<details>' >> $GITHUB_OUTPUT
              echo "<summary>📄 $(basename $f)</summary>" >> $GITHUB_OUTPUT
              echo '' >> $GITHUB_OUTPUT
              cat "$f" >> $GITHUB_OUTPUT
              echo '' >> $GITHUB_OUTPUT
              echo '</details>' >> $GITHUB_OUTPUT
              echo '' >> $GITHUB_OUTPUT
            done
            echo '---' >> $GITHUB_OUTPUT
            echo '*Generated by [docgen](https://pub.dev/packages/docgen_cli)*' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          fi
      - name: Comment on PR
        if: steps.docs.outputs.body
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docgen-docs
          message: ${{ steps.docs.outputs.body }}
