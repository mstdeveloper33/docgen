name: docgen_cli
description: >-
  AI-powered documentation generator for Flutter/Dart and Kotlin projects.
  Scans code structure via static analysis and generates rich Markdown docs
  locally or with Gemini AI.
version: 1.0.0
homepage: https://github.com/mstdeveloper33/docgen
repository: https://github.com/mstdeveloper33/docgen
issue_tracker: https://github.com/mstdeveloper33/docgen/issues

environment:
  sdk: ^3.10.4

executables:
  docgen: docgen

dependencies:
  analyzer: ^12.1.0
  args: ^2.7.0
  google_generative_ai: ^0.4.7
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
